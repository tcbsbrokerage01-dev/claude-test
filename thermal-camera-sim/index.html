<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>熱成像相機模擬</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@500;900&display=swap">
<style>
/* Layout: one screen, one viewfinder. A live heat field fills the frame; HUD hairlines,
   target locks and mono readouts sit on top. Dark only on purpose: a thermal display has no light mode.
   --accent and --grad-v follow the active palette. */
:root {
  color-scheme: dark;
  --void: #05060c;
  --panel: #0a0d19;
  --line-hi: #2e3866;
  --ink: #eceff8;
  --ink-dim: #8b93b0;
  --ink-faint: #5a6282;
  --scrim: rgb(5 6 12 / 0.82);
  --scrim-soft: rgb(5 6 12 / 0.4);
  --scan: rgb(255 255 255 / 0.035);
  --sweep: rgb(255 255 255 / 0.06);
  --accent: #fb8b0c;
  --accent-hi: #fdd247;
  --grad-v: linear-gradient(0deg, #00000a, #fffbe6);

  --font-display: "Chakra Petch", "Noto Sans TC", system-ui, sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --fs-label: 0.72rem;
  --fs-small: 0.85rem;
  --fs-en: clamp(0.85rem, 1.5vw, 1.3rem);
  --fs-hero: clamp(2.2rem, 6.4vw, 5.4rem);
  --side: max(40px, env(safe-area-inset-left, 0px));
  --side-r: max(40px, env(safe-area-inset-right, 0px));
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--void);
  color: var(--ink);
  font-family: var(--font-body);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--accent-hi); outline-offset: 2px; }

.hero {
  position: relative;
  height: 100%;
  min-height: 520px;
  overflow: hidden;
  background: var(--panel);
  cursor: crosshair;
  touch-action: none;
  isolation: isolate;
}
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero::after {
  content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: repeating-linear-gradient(0deg, var(--scan) 0 1px, transparent 1px 3px);
}
.sweep {
  position: absolute; left: 0; right: 0; top: -20%; height: 18%; z-index: 1; pointer-events: none;
  background: linear-gradient(180deg, transparent, var(--sweep), transparent);
  animation: sweep 7s linear infinite;
}
@keyframes sweep { to { transform: translateY(680%); } }
.scrim {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background:
    radial-gradient(ellipse 80% 75% at 55% 45%, transparent 55%, var(--scrim-soft) 100%),
    linear-gradient(90deg, var(--scrim) 0%, var(--scrim-soft) 38%, transparent 62%),
    linear-gradient(0deg, var(--scrim) 0%, transparent 40%);
}

/* corner brackets of the viewfinder */
.frame { position: absolute; inset: 14px; z-index: 2; pointer-events: none; }
.frame span { position: absolute; width: 22px; height: 22px; border: 0 solid var(--ink); }
.frame .tl { left: 0; top: 0; border-left-width: 2px; border-top-width: 2px; }
.frame .tr { right: 0; top: 0; border-right-width: 2px; border-top-width: 2px; }
.frame .bl { left: 0; bottom: 0; border-left-width: 2px; border-bottom-width: 2px; }
.frame .br { right: 0; bottom: 0; border-right-width: 2px; border-bottom-width: 2px; }

.hud-top {
  position: absolute; z-index: 2; top: 26px; left: 0; right: 0; pointer-events: none;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding-left: var(--side); padding-right: var(--side-r);
  font: 500 var(--fs-label)/1.4 var(--font-mono); letter-spacing: 0.12em; color: var(--ink-dim);
}
.hud-top div { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; }
.brand { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); font: 600 0.8rem/1 var(--font-display); letter-spacing: 0.16em; }
.brand svg { color: var(--accent); }
.rec { color: var(--ink); display: inline-flex; align-items: center; gap: 7px; }
.rec i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: blink 1.2s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }

/* temperature scale */
.scale { position: absolute; z-index: 2; right: max(30px, env(safe-area-inset-right, 0px)); top: 76px; bottom: 160px; width: 10px; pointer-events: none; }
.scale i { position: absolute; inset: 0; background: var(--grad-v); border: 1px solid var(--line-hi); }
.scale span {
  position: absolute; right: 18px; bottom: calc(var(--p) * 100%); transform: translateY(50%);
  font: 500 var(--fs-label)/1 var(--font-mono); color: var(--ink-dim); white-space: nowrap;
  text-shadow: 0 0 4px var(--void), 0 0 2px var(--void);
}
.scale span::after { content: ""; position: absolute; right: -14px; top: 50%; width: 6px; height: 1px; background: var(--ink-dim); }

/* target locks around the warm subjects */
.lock {
  position: absolute; z-index: 2; pointer-events: none;
  --c: var(--accent); --l: 16px; --w: 2px;
  background:
    linear-gradient(var(--c), var(--c)) top left / var(--l) var(--w),
    linear-gradient(var(--c), var(--c)) top left / var(--w) var(--l),
    linear-gradient(var(--c), var(--c)) top right / var(--l) var(--w),
    linear-gradient(var(--c), var(--c)) top right / var(--w) var(--l),
    linear-gradient(var(--c), var(--c)) bottom left / var(--l) var(--w),
    linear-gradient(var(--c), var(--c)) bottom left / var(--w) var(--l),
    linear-gradient(var(--c), var(--c)) bottom right / var(--l) var(--w),
    linear-gradient(var(--c), var(--c)) bottom right / var(--w) var(--l);
  background-repeat: no-repeat;
  animation: lock-on 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.lock b {
  position: absolute; left: 0; bottom: calc(100% + 6px); display: flex; gap: 10px; padding: 3px 8px; white-space: nowrap;
  background: var(--scrim); border-left: 2px solid var(--c); color: var(--ink);
  font: 500 0.7rem/1.4 var(--font-mono); letter-spacing: 0.08em; font-variant-numeric: tabular-nums;
}
.lock b span { color: var(--accent-hi); }
@keyframes lock-on { from { transform: scale(1.3); opacity: 0.2; } to { transform: scale(1); opacity: 1; } }

/* cursor reticle */
.reticle { position: absolute; left: 0; top: 0; z-index: 3; width: 56px; height: 56px; margin: -28px 0 0 -28px; pointer-events: none; will-change: transform; }
.reticle::before, .reticle::after { content: ""; position: absolute; }
.reticle::before { left: 0; right: 0; top: 50%; height: 1px; background: linear-gradient(90deg, var(--ink) 0 36%, transparent 36% 64%, var(--ink) 64%); }
.reticle::after { top: 0; bottom: 0; left: 50%; width: 1px; background: linear-gradient(180deg, var(--ink) 0 36%, transparent 36% 64%, var(--ink) 64%); }
.reticle .ring { position: absolute; inset: 14px; border: 1px solid var(--ink); border-radius: 50%; }
.reticle b {
  position: absolute; left: 62px; top: 4px; padding: 3px 7px; white-space: nowrap;
  background: var(--scrim); color: var(--ink); border-left: 2px solid var(--accent);
  font: 500 0.8rem/1.3 var(--font-mono); font-variant-numeric: tabular-nums;
}

/* title + readouts */
.hero-ui {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  display: flex; flex-direction: column; justify-content: flex-end; gap: 26px;
  padding-top: 80px; padding-bottom: 32px;
  padding-left: var(--side); padding-right: max(76px, env(safe-area-inset-right, 0px));
}
.hero-copy { max-width: 780px; display: grid; gap: 14px; }
.eyebrow { margin: 0; font: 500 var(--fs-label)/1 var(--font-mono); letter-spacing: 0.2em; color: var(--accent); }
h1 { margin: 0; display: grid; gap: 10px; }
h1 .en { font: 500 var(--fs-en)/1.2 var(--font-display); letter-spacing: 0.28em; text-transform: uppercase; color: var(--ink-dim); }
h1 .zh { font: 900 var(--fs-hero)/1.02 var(--font-body); letter-spacing: 0.02em; text-wrap: balance; }
h1 em { font: 600 1em/1 var(--font-display); font-style: normal; margin-right: 0.22em; color: transparent; -webkit-text-stroke: 1.5px var(--accent); }
.hint { margin: 0; font-size: var(--fs-small); color: var(--ink-dim); }
.hero-foot {
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px;
  padding-top: 14px; border-top: 1px solid var(--line-hi);
}
.hero-stats { margin: 0; display: flex; flex-wrap: wrap; gap: 10px 30px; }
.hero-stats div { display: grid; gap: 2px; }
.hero-stats dt { font: 500 0.66rem/1 var(--font-mono); letter-spacing: 0.16em; color: var(--ink-faint); }
.hero-stats dd { margin: 0; font: 500 1.15rem/1.2 var(--font-mono); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; pointer-events: auto; }
.chip {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px 7px 8px; border: 1px solid var(--line-hi); background: var(--scrim); color: var(--ink-dim);
  font: 500 0.8rem/1 var(--font-body); cursor: pointer;
}
.chip i { width: 20px; height: 6px; background: var(--pal-grad); }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); }

@media (max-width: 760px) {
  :root { --side: max(28px, env(safe-area-inset-left, 0px)); --side-r: max(28px, env(safe-area-inset-right, 0px)); }
  .hud-top .hide-sm, .hero-stats .hide-sm { display: none; }
  .hero-ui { padding-right: max(56px, env(safe-area-inset-right, 0px)); gap: 20px; padding-bottom: 28px; }
  h1 .en { letter-spacing: 0.16em; }
  .scale { right: max(24px, env(safe-area-inset-right, 0px)); top: 72px; bottom: auto; height: 30%; }
  .hero-stats { gap: 10px 24px; }
}
@media (max-height: 600px) {
  .hint, h1 .en { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .sweep { display: none; }
  .rec i, .lock { animation: none; }
}
</style>
</head>
<body>

<main class="hero" id="viewfinder">
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="sweep" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>
  <div class="frame" aria-hidden="true"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>

  <div class="hud-top" aria-hidden="true">
    <div>
      <span class="brand">
        <svg width="18" height="18" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="6"/><path d="M11 0v6M11 16v6M0 11h6M16 11h6"/></svg>
        THERMAL/SIM
      </span>
      <span class="hide-sm">LWIR 8–14 µm</span>
      <span class="hide-sm">ε 0.95</span>
    </div>
    <div>
      <span class="rec"><i></i>REC <time id="rec">00:00:00</time></span>
      <span id="sensorRes" class="hide-sm">---×---</span>
    </div>
  </div>

  <div class="scale" aria-hidden="true">
    <i></i>
    <span style="--p:1">38°C</span>
    <span style="--p:0.864">35</span>
    <span style="--p:0.636">30</span>
    <span style="--p:0.409">25</span>
    <span style="--p:0.182">20</span>
    <span style="--p:0">16</span>
  </div>

  <div id="locks" aria-hidden="true"></div>
  <div class="reticle" id="reticle" aria-hidden="true" hidden><span class="ring"></span><b id="reticleLabel">--.-°C</b></div>

  <div class="hero-ui">
    <div class="hero-copy">
      <p class="eyebrow">VIBE CODING 系列 · EP.02</p>
      <h1>
        <span class="en">Thermal Camera Simulation</span>
        <span class="zh"><em>02</em>熱成像相機模擬</span>
      </h1>
      <p class="hint">移動游標或手指加熱，點一下投下一團熱。</p>
    </div>
    <div class="hero-foot">
      <dl class="hero-stats">
        <div><dt>MAX</dt><dd id="hMax">--.-°</dd></div>
        <div><dt>MIN</dt><dd id="hMin">--.-°</dd></div>
        <div class="hide-sm"><dt>AVG</dt><dd id="hAvg">--.-°</dd></div>
        <div><dt>SPOT</dt><dd id="hSpot">--.-°</dd></div>
        <div class="hide-sm"><dt>FPS</dt><dd id="hFps">--</dd></div>
      </dl>
      <div class="chips" role="group" aria-label="選擇色盤">
        <button class="chip" type="button" data-pal="ironbow" aria-pressed="true"><i></i>鐵虹</button>
        <button class="chip" type="button" data-pal="rainbow" aria-pressed="false"><i></i>彩虹</button>
        <button class="chip" type="button" data-pal="arctic" aria-pressed="false"><i></i>極地</button>
        <button class="chip" type="button" data-pal="whitehot" aria-pressed="false"><i></i>白熱</button>
        <button class="chip" type="button" data-pal="isotherm" aria-pressed="false"><i></i>等溫</button>
      </div>
    </div>
  </div>
</main>

<script src="heatmaps.js"></script>
<script>
(() => {
  'use strict';

  const HEATMAPS = window.HEATMAPS || {};
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const fmt = (c) => c.toFixed(1);

  /* ---------- palettes ---------- */
  const PALETTES = {
    ironbow:  { accent: '#fb8b0c', hi: '#fdd247', stops: [[0, '#00000a'], [0.14, '#1c0a4a'], [0.3, '#5b0f8a'], [0.45, '#b0257a'], [0.58, '#e8492a'], [0.72, '#fb8b0c'], [0.86, '#fdd247'], [1, '#fffbe6']] },
    rainbow:  { accent: '#22c3ff', hi: '#ffe600', stops: [[0, '#05010f'], [0.1, '#2a0a6b'], [0.22, '#1f3bff'], [0.36, '#00b8ff'], [0.48, '#00e39a'], [0.6, '#9cf000'], [0.7, '#ffe600'], [0.8, '#ff9a00'], [0.9, '#ff2a10'], [1, '#ffffff']] },
    arctic:   { accent: '#f5b32a', hi: '#9ed3f0', stops: [[0, '#02040c'], [0.2, '#0b1d4d'], [0.4, '#1d4f9e'], [0.58, '#3c8fd6'], [0.7, '#9ed3f0'], [0.78, '#f2e2a0'], [0.88, '#f5b32a'], [1, '#fff3c0']] },
    whitehot: { accent: '#e6e9f2', hi: '#ffffff', stops: [[0, '#000000'], [0.5, '#5a5a5a'], [1, '#ffffff']] },
    isotherm: { accent: '#ff4a1a', hi: '#ff9a00', stops: [[0, '#050505'], [0.7, '#bdbdbd'], [0.7, '#ff2a10'], [0.85, '#ff9a00'], [1, '#ffef7a']] },
  };
  const hexRGB = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  function buildLUT(stops) {
    const rgb = stops.map(([p, c]) => [p, hexRGB(c)]);
    const lut = new Uint8ClampedArray(256 * 3);
    for (let i = 0; i < 256; i++) {
      const t = i / 255;
      let k = 0;
      while (k < rgb.length - 2 && t > rgb[k + 1][0]) k++;
      const [p0, a] = rgb[k], [p1, b] = rgb[k + 1];
      const f = p1 > p0 ? clamp((t - p0) / (p1 - p0), 0, 1) : 1;
      for (let c = 0; c < 3; c++) lut[i * 3 + c] = a[c] + (b[c] - a[c]) * f;
    }
    return lut;
  }
  const gradCSS = (stops, deg) => `linear-gradient(${deg}deg, ${stops.map(([p, c]) => `${c} ${(p * 100).toFixed(1)}%`).join(', ')})`;

  let LUT = buildLUT(PALETTES.ironbow.stops);
  const chips = document.querySelectorAll('[data-pal]');
  chips.forEach((el) => {
    el.style.setProperty('--pal-grad', gradCSS(PALETTES[el.dataset.pal].stops, 90));
    el.addEventListener('click', () => setPalette(el.dataset.pal));
  });
  function setPalette(name) {
    const p = PALETTES[name];
    if (!p) return;
    LUT = buildLUT(p.stops);
    const root = document.documentElement.style;
    root.setProperty('--accent', p.accent);
    root.setProperty('--accent-hi', p.hi);
    root.setProperty('--grad-v', gradCSS(p.stops, 0));
    chips.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.pal === name)));
    try { localStorage.setItem('thermal-palette', name); } catch (e) { /* storage unavailable */ }
  }

  /* ---------- helpers ---------- */
  const loadImage = (src) => new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = reject;
    im.src = src;
  });
  const canvas2d = (w, h) => {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return [c, c.getContext('2d', { willReadFrequently: true })];
  };
  // Smooth random blobs in 0..1, used as a non-uniform ambient background
  function blobNoise(w, h, cells) {
    const out = new Float32Array(w * h);
    const [, ox] = canvas2d(w, h);
    ox.imageSmoothingEnabled = true;
    ox.imageSmoothingQuality = 'high';
    [[cells, 0.65], [cells * 3, 0.35]].forEach(([cx, weight]) => {
      const gw = Math.max(2, Math.round(cx)), gh = Math.max(2, Math.round(cx * h / w));
      const [g, gx] = canvas2d(gw, gh);
      const id = gx.createImageData(gw, gh);
      for (let i = 0; i < gw * gh; i++) {
        id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = Math.random() * 255;
        id.data[i * 4 + 3] = 255;
      }
      gx.putImageData(id, 0, 0);
      ox.clearRect(0, 0, w, h);
      ox.drawImage(g, 0, 0, w, h);
      const d = ox.getImageData(0, 0, w, h).data;
      for (let i = 0; i < w * h; i++) out[i] += (d[i * 4] / 255) * weight;
    });
    return out;
  }

  // Value noise in 3D (x, y, time), used for the slow heat shimmer inside the subjects
  function hash3(x, y, z) {
    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(z, 1274126177)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function noise3(x, y, z) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    let fx = x - xi, fy = y - yi, fz = z - zi;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
    const a0 = hash3(xi, yi, zi), a1 = hash3(xi + 1, yi, zi), a2 = hash3(xi, yi + 1, zi), a3 = hash3(xi + 1, yi + 1, zi);
    const b0 = hash3(xi, yi, zi + 1), b1 = hash3(xi + 1, yi, zi + 1), b2 = hash3(xi, yi + 1, zi + 1), b3 = hash3(xi + 1, yi + 1, zi + 1);
    const a = (a0 + (a1 - a0) * fx) + ((a2 + (a3 - a2) * fx) - (a0 + (a1 - a0) * fx)) * fy;
    const b = (b0 + (b1 - b0) * fx) + ((b2 + (b3 - b2) * fx) - (b0 + (b1 - b0) * fx)) * fy;
    return a + (b - a) * fz;
  }
  const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

  /* ---------- heat field ---------- */
  const hero = document.getElementById('viewfinder');
  const field = document.getElementById('field');
  const fctx = field.getContext('2d');
  const locksEl = document.getElementById('locks');
  const reticle = document.getElementById('reticle');
  const reticleLabel = document.getElementById('reticleLabel');
  const stat = { max: document.getElementById('hMax'), min: document.getElementById('hMin'), avg: document.getElementById('hAvg'), spot: document.getElementById('hSpot'), fps: document.getElementById('hFps') };
  const recEl = document.getElementById('rec');
  const RANGE = [16, 38];
  const toC = (v) => RANGE[0] + clamp(v, 0, 1) * (RANGE[1] - RANGE[0]);

  let FW = 0, FH = 0, V, T, AMB, SV, SA, frameImg, sensor, sctx;
  const pointer = { x: 0.5, y: 0.5, px: null, py: null, inside: false, last: -1e9 };
  const images = {};

  /* ---------- subjects ----------
     Every frame each subject is redrawn into the field from a pose (centre, size, scale, tilt, local warp).
     Where it leaves, the field keeps the heat for a moment and lets it fade: the thermal trail. */
  const W = { u: 0, v: 0 };

  function catPose(s, t) {
    const b = s.base;
    const breath = Math.sin(t * 2 * Math.PI / 1.9);
    const sy = 1 + 0.016 * breath, sx = 1 + 0.006 * breath;
    const sway = 0.02 + 0.05 * Math.sin(t * 1.25 + 0.8 * Math.sin(t * 0.37));
    const hx = 0.022 * Math.sin(t * 0.7), hy = 0.01 * Math.sin(t * 1.1 + 0.4);
    const blink = t % 3.7 < 0.16;
    return {
      cx: b.cx, cy: b.bottom - b.h * sy / 2, w: b.w, h: b.h, sx, sy, rot: 0,
      warp(u, v) {
        const tail = smooth(0.66, 0.74, u) * smooth(0.92, 0.72, v);
        const head = smooth(0.38, 0.24, v) * smooth(0.4, 0.55, u);
        W.u = u - sway * tail - hx * head;
        W.v = v - hy * head;
      },
      post: blink ? (u, v, val) => ((u - 0.83) ** 2 + (v - 0.195) ** 2 < 0.0025 ? Math.min(val, 0.6) : val) : null,
    };
  }

  function butterflyPose(s, t) {
    const r = s.base.region;
    const mx = (r.x0 + r.x1) / 2, ax = (r.x1 - r.x0) / 2, my = (r.y0 + r.y1) / 2, ay = (r.y1 - r.y0) / 2;
    const x = mx + ax * (0.65 * Math.sin(0.21 * t) + 0.35 * Math.sin(0.53 * t + 1.3));
    const y = my + ay * (0.6 * Math.sin(0.29 * t + 0.5) + 0.4 * Math.sin(0.71 * t + 2.1));
    const vx = ax * (0.65 * 0.21 * Math.cos(0.21 * t) + 0.35 * 0.53 * Math.cos(0.53 * t + 1.3));
    // flaps in bursts, glides with open wings in between
    const burst = clamp(0.35 + 0.9 * Math.sin(0.5 * t + 0.7), 0, 1);
    const phase = t * 2 * Math.PI * 3.2;
    const fold = burst * (0.5 - 0.5 * Math.cos(phase));
    return {
      cx: x * FW, cy: y * FH + Math.sin(phase) * 0.7 * burst, w: s.base.w, h: s.base.h,
      sx: 1 - 0.8 * fold, sy: 1, rot: clamp(vx * 4, -0.35, 0.35),
    };
  }

  const SUBJECTS = [
    { key: 'cat', label: 'TGT-01 貓 FELIS CATUS', short: 'TGT-01 貓', pose: catPose },
    { key: 'butterfly', label: 'TGT-02 蝶 LEPIDOPTERA', short: 'TGT-02 蝶', pose: butterflyPose },
  ];

  // Resample a heat map to about twice its on-field size; premultiplied so edges blend cleanly
  function prepSource(im, wCells, hCells) {
    const w = Math.max(8, Math.round(wCells * 2)), h = Math.max(8, Math.round(hCells * 2));
    const [, x] = canvas2d(w, h);
    x.imageSmoothingQuality = 'high';
    x.drawImage(im, 0, 0, w, h);
    const d = x.getImageData(0, 0, w, h).data;
    const pre = new Float32Array(w * h), alp = new Float32Array(w * h);
    let u0 = 1, v0 = 1, u1 = 0, v1 = 0;
    for (let i = 0; i < w * h; i++) {
      const a = d[i * 4 + 3] / 255;
      alp[i] = a;
      pre[i] = (d[i * 4] / 255) * a;
      if (a > 0.5) {
        const u = (i % w) / w, v = ((i / w) | 0) / h;
        if (u < u0) u0 = u;
        if (u > u1) u1 = u;
        if (v < v0) v0 = v;
        if (v > v1) v1 = v;
      }
    }
    return { w, h, pre, alp, box: [u0, v0, u1, v1] };
  }

  function rasterize(src, P, t) {
    const cos = Math.cos(P.rot), sin = Math.sin(P.rot);
    const pw = P.w * P.sx, ph = P.h * P.sy;
    const ex = Math.abs(pw / 2 * cos) + Math.abs(ph / 2 * sin), ey = Math.abs(pw / 2 * sin) + Math.abs(ph / 2 * cos);
    const x0 = Math.max(0, Math.floor(P.cx - ex)), x1 = Math.min(FW - 1, Math.ceil(P.cx + ex));
    const y0 = Math.max(0, Math.floor(P.cy - ey)), y1 = Math.min(FH - 1, Math.ceil(P.cy + ey));
    const A = src.alp, PM = src.pre, sw = src.w, sh = src.h;
    const shimmer = still ? 0 : 0.12, tz = t * 0.5;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const dx = x + 0.5 - P.cx, dy = y + 0.5 - P.cy;
        let u = (dx * cos + dy * sin) / pw + 0.5;
        let v = (-dx * sin + dy * cos) / ph + 0.5;
        if (P.warp) { P.warp(u, v); u = W.u; v = W.v; }
        if (u < 0 || u >= 1 || v < 0 || v >= 1) continue;
        const fx = clamp(u * sw - 0.5, 0, sw - 1.001), fy = clamp(v * sh - 0.5, 0, sh - 1.001);
        const ix = fx | 0, iy = fy | 0, kx = fx - ix, ky = fy - iy, i0 = iy * sw + ix, i1 = i0 + sw;
        const a = (A[i0] * (1 - kx) + A[i0 + 1] * kx) * (1 - ky) + (A[i1] * (1 - kx) + A[i1 + 1] * kx) * ky;
        if (a < 0.02) continue;
        const pre = (PM[i0] * (1 - kx) + PM[i0 + 1] * kx) * (1 - ky) + (PM[i1] * (1 - kx) + PM[i1 + 1] * kx) * ky;
        let val = pre / a;
        if (P.post) val = P.post(u, v, val);
        if (shimmer) val += (noise3(x * 0.16, y * 0.16, tz) - 0.5) * shimmer;
        const i = y * FW + x;
        if (a >= SA[i]) { SA[i] = a; SV[i] = val; }
      }
    }
  }

  function lockBox(s) {
    const [u0, v0, u1, v1] = s.src.box, p = s.p, pad = 1.5;
    return {
      x0: p.cx + (u0 - 0.5) * p.w - pad, y0: p.cy + (v0 - 0.5) * p.h - pad,
      x1: p.cx + (u1 - 0.5) * p.w + pad, y1: p.cy + (v1 - 0.5) * p.h + pad,
    };
  }

  function placeSubjects(t) {
    SA.fill(0);
    SV.fill(0);
    SUBJECTS.forEach((s) => {
      if (!s.src) return;
      s.p = s.pose(s, t);
      rasterize(s.src, s.p, t);
      const b = s.lockBox = lockBox(s);
      const st = s.lockEl.style;
      st.left = (b.x0 / FW * 100) + '%';
      st.top = (b.y0 / FH * 100) + '%';
      st.width = ((b.x1 - b.x0) / FW * 100) + '%';
      st.height = ((b.y1 - b.y0) / FH * 100) + '%';
    });
  }

  function layout() {
    const w = Math.max(1, hero.clientWidth), h = Math.max(1, hero.clientHeight);
    const wide = w / h >= 1.15;
    FW = Math.round(clamp(w / 5, 150, 300));
    FH = Math.max(80, Math.round(FW * h / w));
    [sensor, sctx] = canvas2d(FW, FH);
    frameImg = sctx.createImageData(FW, FH);
    const n = FW * FH;
    V = new Float32Array(n); T = new Float32Array(n);
    SV = new Float32Array(n); SA = new Float32Array(n);
    AMB = new Float32Array(n);
    const noise = blobNoise(FW, FH, 7);
    for (let y = 0; y < FH; y++) {
      for (let x = 0; x < FW; x++) {
        const i = y * FW + x;
        AMB[i] = 0.17 + 0.05 * (1 - y / FH) + (noise[i] - 0.5) * 0.14;
      }
    }
    V.set(AMB);

    const [cat, bf] = SUBJECTS;
    if (images.cat) {
      const ch = wide ? FH * 0.68 : Math.min(FH * 0.28, FW * 0.9);
      cat.base = { cx: FW * (wide ? 0.74 : 0.66), bottom: wide ? FH * 0.88 : FH * 0.16 + ch, w: ch * images.cat.width / images.cat.height, h: ch };
    }
    if (images.butterfly) {
      const bw = FW * (wide ? 0.24 : 0.3);
      bf.base = {
        w: bw, h: bw * images.butterfly.height / images.butterfly.width,
        // the flight area stays left of the cat and above the title
        region: wide ? { x0: 0.14, x1: 0.48, y0: 0.24, y1: 0.48 } : { x0: 0.2, x1: 0.4, y0: 0.2, y1: 0.42 },
      };
    }
    locksEl.textContent = '';
    SUBJECTS.forEach((s) => {
      s.src = images[s.key] ? prepSource(images[s.key], s.base.w, s.base.h) : null;
      if (!s.src) return;
      s.lockEl = document.createElement('div');
      s.lockEl.className = 'lock';
      const tag = document.createElement('b');
      s.tempEl = document.createElement('span');
      s.tempEl.textContent = '--.-°C';
      tag.append(w < 560 ? s.short : s.label, s.tempEl);
      s.lockEl.append(tag);
      locksEl.append(s.lockEl);
    });

    const dpr = Math.min(2, window.devicePixelRatio || 1);
    field.width = Math.round(w * dpr);
    field.height = Math.round(h * dpr);
    placeSubjects(clock(performance.now()));
    for (let i = 0; i < 80; i++) step();
    document.getElementById('sensorRes').textContent = `${FW}×${FH}`;
  }

  const DIFFUSE = 0.2, COOL = 0.014, PULL = 0.45;
  function step() {
    const w = FW, h = FH;
    for (let y = 0; y < h; y++) {
      const up = y > 0 ? -w : 0, dn = y < h - 1 ? w : 0, row = y * w;
      for (let x = 0; x < w; x++) {
        const i = row + x, v = V[i];
        const l = x > 0 ? V[i - 1] : v, r = x < w - 1 ? V[i + 1] : v;
        let nv = v + DIFFUSE * (l + r + V[i + up] + V[i + dn] - 4 * v) - COOL * (v - AMB[i]);
        const a = SA[i];
        if (a > 0) nv += (SV[i] - nv) * a * PULL;
        T[i] = nv;
      }
    }
    const t = V; V = T; T = t;
  }

  // Pull cells toward a target heat with a gaussian falloff
  function addHeat(nx, ny, target, amount, sigma) {
    const cx = nx * FW, cy = ny * FH, r = Math.ceil(sigma * 3), inv = 1 / (2 * sigma * sigma);
    const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(FW - 1, Math.ceil(cx + r));
    const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(FH - 1, Math.ceil(cy + r));
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const dx = x - cx, dy = y - cy, g = Math.exp(-(dx * dx + dy * dy) * inv);
        const i = y * FW + x;
        if (V[i] < target) V[i] += (target - V[i]) * amount * g;
      }
    }
  }
  const sampleField = (nx, ny) => V[clamp(Math.floor(ny * FH), 0, FH - 1) * FW + clamp(Math.floor(nx * FW), 0, FW - 1)];

  function setPointer(e) {
    const r = hero.getBoundingClientRect();
    pointer.x = clamp((e.clientX - r.left) / r.width, 0, 1);
    pointer.y = clamp((e.clientY - r.top) / r.height, 0, 1);
    pointer.inside = true;
    pointer.last = performance.now();
  }
  hero.addEventListener('pointermove', setPointer, { passive: true });
  hero.addEventListener('pointerleave', () => { pointer.inside = false; pointer.px = null; });
  hero.addEventListener('pointerdown', (e) => {
    if (!V || e.target.closest('button')) return;
    setPointer(e);
    addHeat(pointer.x, pointer.y, 1, 0.9, 7 * FW / 240);
  });

  /* ---------- frame loop ---------- */
  const t0 = performance.now();
  const clock = (now) => (still ? 2 : (now - t0) / 1000);
  let lastFrame = t0, fpsFrames = 0, fpsTime = 0, statTime = 0, spotV = 0, wasLive = false;

  function frame(now) {
    requestAnimationFrame(frame);
    if (!V) return;
    const dt = Math.min(100, now - lastFrame);
    lastFrame = now;
    fpsFrames++; fpsTime += dt;

    placeSubjects(clock(now));

    const sigma = 4.2 * FW / 240;
    const live = pointer.inside && now - pointer.last < 2500;
    if (live && !wasLive) pointer.px = null;
    wasLive = live;
    let rx, ry;
    if (live) {
      // lay heat along the path since last frame so fast moves leave a continuous trail
      const px = pointer.px ?? pointer.x, py = pointer.py ?? pointer.y;
      const dist = Math.hypot((pointer.x - px) * FW, (pointer.y - py) * FH);
      const steps = Math.max(1, Math.ceil(dist / (sigma * 0.6)));
      for (let s = 1; s <= steps; s++) {
        const f = s / steps;
        addHeat(px + (pointer.x - px) * f, py + (pointer.y - py) * f, 0.86, 0.12 / Math.sqrt(steps), sigma);
      }
      pointer.px = pointer.x; pointer.py = pointer.y;
      rx = pointer.x; ry = pointer.y;
    } else if (!still && SUBJECTS[1].p) {
      // idle: the reticle tracks the butterfly
      rx = SUBJECTS[1].p.cx / FW;
      ry = SUBJECTS[1].p.cy / FH;
    }
    step(); step();

    const d = frameImg.data;
    for (let i = 0, j = 0; i < V.length; i++, j += 4) {
      const v = V[i] * 255 + (Math.random() - 0.5) * 7;
      const k = (v < 0 ? 0 : v > 255 ? 255 : v | 0) * 3;
      d[j] = LUT[k]; d[j + 1] = LUT[k + 1]; d[j + 2] = LUT[k + 2]; d[j + 3] = 255;
    }
    sctx.putImageData(frameImg, 0, 0);
    fctx.imageSmoothingEnabled = true;
    fctx.imageSmoothingQuality = 'high';
    fctx.drawImage(sensor, 0, 0, field.width, field.height);

    if (rx !== undefined) {
      reticle.hidden = false;
      reticle.style.transform = `translate(${rx * hero.clientWidth}px, ${ry * hero.clientHeight}px)`;
      spotV = sampleField(rx, ry);
    } else {
      reticle.hidden = true;
    }

    statTime += dt;
    if (statTime > 160) {
      statTime = 0;
      let mx = -1, mn = 2, sum = 0;
      for (let i = 0; i < V.length; i++) { const v = V[i]; if (v > mx) mx = v; if (v < mn) mn = v; sum += v; }
      stat.max.textContent = fmt(toC(mx)) + '°';
      stat.min.textContent = fmt(toC(mn)) + '°';
      stat.avg.textContent = fmt(toC(sum / V.length)) + '°';
      stat.spot.textContent = rx !== undefined ? fmt(toC(spotV)) + '°' : '—';
      reticleLabel.textContent = fmt(toC(spotV)) + '°C';
      SUBJECTS.forEach((s) => {
        if (!s.lockBox) return;
        const b = s.lockBox;
        const x0 = clamp(Math.floor(b.x0), 0, FW - 1), x1 = clamp(Math.ceil(b.x1), 0, FW - 1);
        const y0 = clamp(Math.floor(b.y0), 0, FH - 1), y1 = clamp(Math.ceil(b.y1), 0, FH - 1);
        let m = 0;
        for (let y = y0; y <= y1; y++) {
          for (let x = x0; x <= x1; x++) m = Math.max(m, V[y * FW + x]);
        }
        s.tempEl.textContent = fmt(toC(m)) + '°C';
      });
      if (fpsTime > 500) { stat.fps.textContent = Math.round(fpsFrames * 1000 / fpsTime); fpsFrames = 0; fpsTime = 0; }
    }
    const s = Math.floor((now - t0) / 1000);
    recEl.textContent = [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map((n) => String(n).padStart(2, '0')).join(':');
  }

  /* ---------- start ---------- */
  let saved = null;
  try { saved = localStorage.getItem('thermal-palette'); } catch (e) { /* storage unavailable */ }
  setPalette(PALETTES[saved] ? saved : 'ironbow');

  Promise.all(SUBJECTS.map((s) => (HEATMAPS[s.key]
    ? loadImage(HEATMAPS[s.key]).then((im) => { images[s.key] = im; }).catch(() => {})
    : null))).then(() => {
    layout();
    let size = `${hero.clientWidth}x${hero.clientHeight}`, timer = 0;
    window.addEventListener('resize', () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        const next = `${hero.clientWidth}x${hero.clientHeight}`;
        if (next !== size) { size = next; layout(); }
      }, 150);
    });
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
